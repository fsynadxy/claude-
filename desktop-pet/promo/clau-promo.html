<title>Clau娘宣传片</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one 16:9 white stage (the film itself), with a slim player bar under it. Single light look by design. */
:root {
  --page: #F4F0EB;
  --stage: #FFFFFF;
  --ink: #3B2620;
  --muted: #8A766B;
  --accent: #E0672C;
  --bar: #FFFFFF;
  --line: #E7DDD3;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--ink); font-family: var(--font-body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: var(--stage); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(59, 38, 32, 0.12); }
canvas { display: block; width: 100%; height: 100%; }
.play { position: absolute; inset: 0; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; }
.play span { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(224, 103, 44, 0.35); transition: transform .15s; }
.play:hover span, .play:focus-visible span { transform: scale(1.06); }
.play:focus-visible { outline: none; }
.play svg { margin-left: 6px; }
.bar { display: flex; align-items: center; gap: 12px; background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.bar button { appearance: none; border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
.bar button:hover { background: var(--page); }
.bar button:focus-visible, #seek:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#seek { flex: 1; min-width: 0; accent-color: var(--accent); }
.time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); }
body.export .wrap { padding: 0; max-width: none; }
body.export .bar, body.export .note, body.export .play { display: none; }
body.export .screen { border-radius: 0; box-shadow: none; width: 1920px; height: 1080px; }
</style>

<div class="wrap">
  <div class="screen">
    <canvas id="c" width="1920" height="1080" aria-label="Clau娘宣传动画"></canvas>
    <button class="play" id="bigplay" aria-label="播放"><span><svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M2 2 L32 19 L2 36 Z" fill="#FFFFFF"/></svg></span></button>
  </div>
  <div class="bar">
    <button id="toggle" type="button">播放</button>
    <input id="seek" type="range" min="0" max="63" step="0.01" value="3" aria-label="进度">
    <span class="time" id="time">0:03 / 1:03</span>
    <button id="replay" type="button">从头播放</button>
  </div>
  <p class="note">有声音（离线语音合成的台词）。动画全部由代码实时绘制，人物来自 App 里的同一套帧。</p>
</div>

<script>
(function () {
  "use strict";
  const W = 1920, H = 1080, DURATION = 63;
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const exportMode = location.search.indexOf("export") >= 0;
  if (exportMode) document.body.classList.add("export");

  // ---------------------------------------------------------------- palette & fonts
  const C = {
    ink: "#3B2620", muted: "#8A766B", accent: "#E0672C", accentSoft: "#FCE6D8",
    bubble: "rgba(43,33,29,0.95)", bubbleLine: "#F3E2D2", bubbleText: "#FFF8F0",
    bezel: "#2B211D", line: "#E7DDD3",
  };
  const BODY = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
  const DISPLAY = '"ZCOOL KuaiLe", "Noto Sans SC", sans-serif';

  // ---------------------------------------------------------------- assets
  const SETS = {
    idle: 1, blink: 2, talk: 2, poke: 1, drag: 1, fall: 1, think: 1, shy: 1, angry: 1, sad: 1,
    walk: 8, tea: 4, pat: 4, land: 4, dizzy: 4, happy: 4, fly: 4, hang: 2, wave: 4, curtsy: 4,
  };
  const FX = ["notice", "heart", "flower", "sweat", "swirl", "dots", "question", "anger", "sparkle", "exclaim", "music"];
  const img = {};
  const loads = [];
  function load(key, src) {
    const im = new Image();
    loads.push(new Promise((res) => { im.onload = res; im.onerror = res; }));
    im.src = src;
    img[key] = im;
  }
  for (const [name, n] of Object.entries(SETS)) {
    for (let i = 1; i <= n; i++) load(`${name}_${i}`, `assets/${name}_${String(i).padStart(2, "0")}.webp`);
  }
  for (const f of FX) load("fx_" + f, `assets/fx_${f}.webp`);
  load("avatar", "assets/avatar.webp");

  // voice lines: [start, duration, text]
  const VOICE = {
    v0: [1.4, 3.02, "你好，我是 Claude。现在，住在你的屏幕上。"],
    v1: [15.8, 2.48, "这么久啊，花都要被你摸歪了。"],
    v2: [26.3, 4.03, "辛苦了，能一口气收尾真不容易。是哪里出的问题？"],
    v3: [37.1, 0.69, "起飞！"],
    v4: [46.5, 3.51, "这是在写周报吧？第三条可以再具体一点。"],
    v5: [59.4, 2.15, "有空的话，来找我聊聊吧。"],
  };
  const audio = {};
  if (!exportMode) for (const k of Object.keys(VOICE)) { const a = new Audio(`audio/${k}.mp3`); a.preload = "auto"; audio[k] = a; }

  // ---------------------------------------------------------------- math
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  const outCubic = (k) => 1 - Math.pow(1 - k, 3);
  const inCubic = (k) => k * k * k;
  const outBack = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
  const between = (t, a, b) => t >= a && t < b;
  const loopIdx = (t, t0, fps) => Math.max(0, Math.floor((t - t0) * fps));
  const onceIdx = (t, t0, fps, n) => Math.min(n - 1, Math.max(0, Math.floor((t - t0) * fps)));

  // ---------------------------------------------------------------- layout
  const PHONE = { x: 1050, y: 60, w: 500, h: 960, r: 72 };
  const SCR = { x: 1066, y: 76, w: 468, h: 928, r: 58 };
  const GROUND = SCR.y + SCR.h - 44;
  const PS = 0.36;                       // pet scale inside the phone
  const BIG = { x: 960, y: 850, s: 0.78 };
  const CX = SCR.x + SCR.w / 2;
  const HANG_Y = SCR.y + 44 + 780 * PS;   // feet line that puts her hands at the top of the screen

  // ---------------------------------------------------------------- the pet over time
  function pet(t) {
    const p = { anim: "idle", i: 0, x: CX, y: GROUND, s: PS, flip: false, rot: 0, pivot: 0.975, alpha: 1, pop: 1, talk: false };
    const talking = (k) => between(t, VOICE[k][0], VOICE[k][0] + VOICE[k][1]);
    // intro
    if (t < 5.3) {
      Object.assign(p, { x: BIG.x, y: BIG.y, s: BIG.s });
      if (between(t, 0.35, 1.5)) { p.anim = "curtsy"; p.i = onceIdx(t, 0.35, 3.6, 4); }
      p.alpha = outCubic(prog(t, 0, 0.5));
      p.talk = talking("v0");
      return p;
    }
    // fly into the phone
    if (t < 6.4) {
      const k = inOut(prog(t, 5.3, 6.4));
      Object.assign(p, { anim: "fly", i: loopIdx(t, 5.3, 9), x: lerp(BIG.x, CX, k), y: lerp(BIG.y, GROUND, k) - Math.sin(k * Math.PI) * 120, s: lerp(BIG.s, PS, k) });
      return p;
    }
    if (t < 6.9) { p.anim = "land"; p.i = onceIdx(t, 6.4, 8, 4); return p; }
    // daily life: walk left, walk back, tea
    if (t < 8.4) { p.anim = "walk"; p.i = loopIdx(t, 6.9, 10); p.x = lerp(CX, CX - 130, prog(t, 6.9, 8.4)); return p; }
    if (t < 8.5) { p.x = CX - 130; return p; }
    if (t < 10.2) { p.anim = "walk"; p.i = loopIdx(t, 8.5, 10); p.flip = true; p.x = lerp(CX - 130, CX, prog(t, 8.5, 10.2)); return p; }
    if (t < 12.2) { p.anim = "tea"; p.i = loopIdx(t, 10.3, 1.8) % 4; return p; }
    // interactions
    if (between(t, 12.8, 13.6)) { p.anim = "poke"; if (t < 13.15) p.y += Math.sin((t - 12.8) * 60) * 3 * (1 - (t - 12.8) / 0.35); return p; }
    if (between(t, 14.0, 15.6)) { p.anim = "pat"; p.i = loopIdx(t, 14.0, 5) % 4; p.rot = 1.2 * Math.sin(t * 4); return p; }
    if (between(t, 15.6, 16.9)) { p.anim = "shy"; return p; }
    if (between(t, 16.9, 18.6)) { p.talk = talking("v1"); return p; }
    if (between(t, 18.6, 19.9)) {
      const lift = outCubic(prog(t, 18.6, 18.9));
      const sx = between(t, 18.9, 19.8) ? Math.sin((t - 18.9) * 18) * 70 * Math.sin(prog(t, 18.9, 19.8) * Math.PI) : 0;
      const vx = between(t, 18.9, 19.8) ? Math.cos((t - 18.9) * 18) * 18 * 70 : 0;
      Object.assign(p, { anim: "drag", x: CX + sx, y: GROUND - 140 * lift, rot: clamp(-vx / 900 * 16, -16, 16), pivot: 0.17 });
      return p;
    }
    if (between(t, 19.9, 20.25)) { p.anim = "fall"; p.y = lerp(GROUND - 140, GROUND, inCubic(prog(t, 19.9, 20.25))); return p; }
    if (between(t, 20.25, 20.8)) { p.anim = "land"; p.i = onceIdx(t, 20.25, 7.5, 4); return p; }
    if (between(t, 20.8, 22.0)) { p.anim = "dizzy"; p.i = loopIdx(t, 20.8, 5) % 4; p.rot = 3 * Math.sin((t - 20.8) * 5 * Math.PI / 2); return p; }
    // chat
    if (between(t, 22.6, 22.95)) { p.anim = "poke"; return p; }
    if (between(t, 25.1, 26.2)) { p.anim = "think"; return p; }
    if (between(t, 26.2, 27.4)) { p.anim = "happy"; p.i = loopIdx(t, 26.2, 8) % 4; return p; }
    if (t < 31.0) { p.talk = talking("v2"); return p; }
    // expressions
    if (t < 36.0) {
      const steps = [[31.3, "happy"], [32.2, "shy"], [33.1, "angry"], [34.0, "sad"], [34.9, "think"]];
      let cur = null;
      for (const s of steps) if (t >= s[0]) cur = s;
      if (cur) {
        p.anim = cur[1];
        if (cur[1] === "happy") p.i = loopIdx(t, cur[0], 8) % 4;
        p.pop = 1 + 0.06 * Math.sin(prog(t, cur[0], cur[0] + 0.25) * Math.PI);
      }
      return p;
    }
    // keyboard takeoff
    if (between(t, 36.95, 37.1)) { p.anim = "land"; p.i = 0; return p; }
    if (between(t, 37.1, 37.55)) { p.anim = "fly"; p.i = loopIdx(t, 37.1, 10) % 4; p.y = lerp(GROUND, HANG_Y, inCubic(prog(t, 37.1, 37.55))); return p; }
    if (between(t, 37.55, 40.9)) {
      const sw = Math.sin((t - 37.55) * 2.4);
      Object.assign(p, { anim: "hang", i: sw < 0 ? 0 : 1, y: HANG_Y, rot: 6 * sw * Math.min(1, (t - 37.55) * 2), pivot: 0.05 });
      return p;
    }
    if (between(t, 40.9, 41.35)) { p.anim = "fall"; p.y = lerp(HANG_Y, GROUND, inCubic(prog(t, 40.9, 41.35))); return p; }
    if (between(t, 41.35, 41.9)) { p.anim = "land"; p.i = onceIdx(t, 41.35, 7.5, 4); return p; }
    // look at the screen
    if (between(t, 43.3, 43.9)) { p.anim = "poke"; return p; }
    if (between(t, 43.9, 45.6)) { p.alpha = 1 - prog(t, 43.9, 44.15); p.pop = lerp(1, 0.7, prog(t, 43.9, 44.15)); return p; }
    if (between(t, 45.6, 46.5)) { p.anim = "think"; p.pop = outBack(prog(t, 45.6, 45.9)); p.alpha = prog(t, 45.6, 45.75); return p; }
    if (t < 50.6) { p.talk = talking("v4"); return p; }
    // character cards: wave
    if (t < 53.4) { if (t > 50.8) { p.anim = "wave"; p.i = loopIdx(t, 50.8, 6) % 4; } return p; }
    if (t < 56.0) return p;
    // back to the centre
    if (t < 57.2) {
      const k = inOut(prog(t, 56.0, 57.2));
      Object.assign(p, { anim: "fly", i: loopIdx(t, 56, 9) % 4, x: lerp(CX, BIG.x, k), y: lerp(GROUND, BIG.y, k) - Math.sin(k * Math.PI) * 140, s: lerp(PS, BIG.s, k) });
      return p;
    }
    Object.assign(p, { x: BIG.x, y: BIG.y, s: BIG.s });
    if (t < 57.7) { p.anim = "land"; p.i = onceIdx(t, 57.2, 8, 4); return p; }
    if (between(t, 57.8, 59.2)) { p.anim = "curtsy"; p.i = onceIdx(t, 57.8, 3.2, 4); return p; }
    p.talk = talking("v5");
    return p;
  }

  function drawPet(t) {
    const p = pet(t);
    if (p.alpha <= 0.01) return p;
    let key = `${p.anim}_${(p.i % SETS[p.anim]) + 1}`;
    if (p.anim === "idle") {
      if (p.talk) {
        const m = Math.floor(t * 11) % 4;
        key = m === 2 ? "talk_1" : m === 0 ? "idle_1" : "talk_2";
      } else {
        const b = (t * 1000 % 3700) / 1000;           // blink every 3.7 s
        if (b < 0.06 || between(b, 0.16, 0.22)) key = "blink_1";
        else if (b < 0.16) key = "blink_2";
      }
    }
    const im = img[key];
    if (!im || !im.width) return p;
    const s = p.s * p.pop;
    const breath = p.anim === "idle" && !p.talk ? 0.008 * Math.sin(t * 2 * Math.PI / 3.2) : 0;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    if (p.rot) {
      const py = -780 * p.s + 800 * p.s * p.pivot;
      ctx.translate(0, py); ctx.rotate(p.rot * Math.PI / 180); ctx.translate(0, -py);
    }
    ctx.scale((p.flip ? -1 : 1) * s * (1 - breath * 0.5), s * (1 + breath));
    ctx.drawImage(im, -320, -780, 640, 800);
    ctx.restore();
    return p;
  }

  // ---------------------------------------------------------------- effects above her head
  const FXEV = [
    [12.82, "notice", 0.9], [14.3, "heart", 1.2], [15.0, "flower", 1.2], [20.85, "swirl", 1.3],
    [22.62, "notice", 0.6], [25.15, "dots", 1.1], [26.25, "heart", 1.3], [32.2, "heart", 0.8], [33.1, "anger", 0.8],
    [34.0, "sweat", 0.8], [34.9, "question", 1.0], [36.85, "exclaim", 0.8], [43.3, "notice", 0.5], [45.65, "dots", 0.9],
    [46.5, "sparkle", 1.0], [51.0, "music", 1.4], [59.4, "sparkle", 1.2],
  ];
  function drawFx(t, p) {
    for (const [t0, name, dur] of FXEV) {
      if (t < t0 || t > t0 + dur) continue;
      const im = img["fx_" + name]; if (!im || !im.width) continue;
      const age = (t - t0) / dur;
      const pop = age < 0.15 ? 0.6 + age / 0.15 * 0.4 : 1;
      const a = age > 0.75 ? (1 - age) / 0.25 : 1;
      const size = 800 * p.s * 0.13 * pop;
      const k = size / Math.max(im.width, im.height);
      const fx = p.x + 640 * p.s * 0.22, fy = p.y - 780 * p.s + 800 * p.s * 0.16 - age * 800 * p.s * 0.05;
      ctx.save(); ctx.globalAlpha = a;
      ctx.drawImage(im, fx - im.width * k / 2, fy - im.height * k / 2, im.width * k, im.height * k);
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------- drawing helpers
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function wrap(text, maxW) {
    // CJK breaks between characters; runs of Latin letters/digits stay whole
    const tokens = text.match(/[A-Za-z0-9.\-_/]+|./gu) || [];
    const lines = []; let cur = "";
    for (const tok of tokens) {
      const test = cur + tok;
      if (ctx.measureText(test).width > maxW && cur.trim()) {
        if ("，。！？、；：）》」".includes(tok)) { lines.push(test); cur = ""; continue; }
        lines.push(cur); cur = tok === " " ? "" : tok;
      } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function bubble(x, bottom, text, shown, alpha, fontPx, maxW, lo, hi) {
    ctx.save();
    ctx.font = `500 ${fontPx}px ${BODY}`;
    const lines = wrap(text, maxW);
    const lh = fontPx * 1.45;
    let w = 0; for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    w = Math.max(w + 36, 90); const h = lines.length * lh + 26;
    const bx = clamp(x - w / 2, lo, hi - w), by = bottom - h - 12;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.bubble; ctx.strokeStyle = C.bubbleLine; ctx.lineWidth = 2;
    rr(bx, by, w, h, 18); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 10, by + h - 1); ctx.lineTo(x, by + h + 12); ctx.lineTo(x + 10, by + h - 1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 10, by + h); ctx.lineTo(x, by + h + 12); ctx.lineTo(x + 10, by + h); ctx.stroke();
    ctx.fillStyle = C.bubbleText; ctx.textBaseline = "top";
    let left = shown;
    lines.forEach((l, i) => {
      const part = [...l].slice(0, Math.max(0, left)).join("");
      left -= [...l].length;
      ctx.fillText(part, bx + 18, by + 13 + i * lh + (lh - fontPx) / 2 - 2);
    });
    ctx.restore();
    return { bx, by, w, h };
  }
  function headTop(p) { return p.y - (780 - 150) * p.s; }

  // ---------------------------------------------------------------- phone
  function phoneAlpha(t) { return Math.min(prog(t, 5.0, 6.0), 1 - prog(t, 55.9, 56.8)); }
  function phoneScale(t) { return lerp(0.94, 1, outCubic(prog(t, 5.0, 6.0))) * lerp(1, 0.94, prog(t, 55.9, 56.8)); }

  function drawWallpaper(t) {
    const g = ctx.createLinearGradient(0, SCR.y, 0, SCR.y + SCR.h);
    g.addColorStop(0, "#FFF7EF"); g.addColorStop(1, "#FBE3D1");
    ctx.fillStyle = g; ctx.fillRect(SCR.x, SCR.y, SCR.w, SCR.h);
    const cols = ["#F6C8A6", "#CFE3D4", "#D7DAF2", "#F3D3DF", "#F9E2A9", "#CDE6EE", "#F2CBB8", "#DCD3EE"];
    for (let r = 0; r < 2; r++) for (let c = 0; c < 4; c++) {
      const x = SCR.x + 44 + c * 104, y = SCR.y + 110 + r * 120;
      ctx.fillStyle = cols[r * 4 + c]; rr(x, y, 72, 72, 20); ctx.fill();
      ctx.fillStyle = "rgba(59,38,32,0.18)"; rr(x + 12, y + 84, 48, 8, 4); ctx.fill();
    }
  }
  function drawDoc(t, a) {
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(SCR.x, SCR.y, SCR.w, SCR.h);
    ctx.fillStyle = "#F4EEE8"; ctx.fillRect(SCR.x, SCR.y + 60, SCR.w, 64);
    ctx.fillStyle = C.ink; ctx.font = `700 22px ${BODY}`; ctx.textBaseline = "middle";
    ctx.fillText("周报.docx", SCR.x + 28, SCR.y + 92);
    ctx.font = `900 30px ${BODY}`; ctx.fillText("本周工作总结", SCR.x + 28, SCR.y + 180);
    ctx.font = `400 22px ${BODY}`; ctx.fillStyle = "#5B4A42";
    const items = ["1. 完成桌宠的聊天与语音功能", "2. 修复动画帧里的眼白缺失", "3. 优化了一些东西"];
    items.forEach((s, i) => ctx.fillText(s, SCR.x + 28, SCR.y + 240 + i * 52));
    ctx.fillStyle = "#EDE6DF";
    for (let i = 0; i < 4; i++) { rr(SCR.x + 28, SCR.y + 420 + i * 34, SCR.w - 56 - (i % 2) * 90, 12, 6); ctx.fill(); }
    ctx.restore();
  }
  function drawStatus() {
    ctx.fillStyle = C.ink; ctx.font = `700 20px ${BODY}`; ctx.textBaseline = "middle";
    ctx.fillText("9:41", SCR.x + 40, SCR.y + 30);
    ctx.fillStyle = "rgba(59,38,32,0.75)";
    rr(SCR.x + SCR.w - 78, SCR.y + 22, 36, 16, 5); ctx.fill();
    for (let i = 0; i < 3; i++) { rr(SCR.x + SCR.w - 124 + i * 9, SCR.y + 34 - i * 5, 6, 6 + i * 5, 2); ctx.fill(); }

    if (glow > 0) {
      const g = ctx.createRadialGradient(960, 620, 50, 960, 620, 620);
      g.addColorStop(0, `rgba(252,230,216,${0.9 * glow})`); g.addColorStop(1, "rgba(252,230,216,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    drawCaptions(t);
    drawBrand(t);
    drawTitles(t);
    const inPhone = drawPhone(t);
    const p = pet(t);
    if (inPhone) {
      drawKeyboard(t);
      if (t > 6.4 && t < 55.9) { drawPet(t); drawFx(t, p); }
      drawEmotionTag(t, p);
      drawInput(t, p);
      drawSay(t, p, "phone");
      drawConsent(t);
      drawShutter(t);
      endPhone();
    }
    if (!(t > 6.4 && t < 55.9)) { drawPet(t); drawFx(t, p); }
    drawSay(t, p, "stage");
    drawCards(t);
    drawTaps(t);
    finger(t);
  }

  // ---------------------------------------------------------------- player
  const seek = document.getElementById("seek");
  const toggle = document.getElementById("toggle");
  const big = document.getElementById("bigplay");
  const timeLabel = document.getElementById("time");
  let playing = false, t = 3.0, last = 0;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function syncAudio() {
    for (const [k, a] of Object.entries(audio)) {
      const [s, d] = VOICE[k];
      const on = playing && t >= s && t < s + d;
      if (on && a.paused) { try { a.currentTime = Math.max(0, t - s); a.play().catch(() => {}); } catch (e) {} }
      if (!on && !a.paused) a.pause();
    }
  }
  function frame(now) {
    if (!playing) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    t += dt;
    if (t >= DURATION) { t = DURATION; setPlaying(false); }
    render(t); seek.value = t; timeLabel.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
    syncAudio();
    if (playing) requestAnimationFrame(frame);
  }
  function setPlaying(on) {
    playing = on;
    toggle.textContent = on ? "暂停" : "播放";
    big.hidden = on;
    if (on) { if (t >= DURATION - 0.05) t = 0; last = performance.now(); requestAnimationFrame(frame); }
    syncAudio();
  }
  toggle.addEventListener("click", () => setPlaying(!playing));
  big.addEventListener("click", () => setPlaying(true));
  document.getElementById("replay").addEventListener("click", () => { t = 0; setPlaying(true); });
  seek.addEventListener("input", () => {
    t = Number(seek.value); render(t); timeLabel.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
    for (const a of Object.values(audio)) if (!a.paused) a.pause();
    syncAudio();
  });

  const fontsReady = Promise.all([
    document.fonts.load(`400 32px "Noto Sans SC"`, "中文"), document.fonts.load(`700 32px "Noto Sans SC"`, "中文"),
    document.fonts.load(`900 32px "Noto Sans SC"`, "中文"), document.fonts.load(`400 32px "ZCOOL KuaiLe"`, "Clau娘"),
  ]).catch(() => {});
  const ready = Promise.all([fontsReady, ...loads]).then(() => { render(t); });
  render(t);
  window.__promo = { duration: DURATION, render, ready };
})();
</script>
