<!doctype html>
<html lang="zh-CN">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LO-O-OVE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=DM+Mono:wght@300;400&family=Noto+Serif+SC:wght@300;400;600&display=swap">
<style>
/* Layout: one micrograph plate. The field (canvas) is full-bleed and holds the specimen; instrument captions sit in
   the top corners with the course of the illness between them; one subtitle line of voice rides above an ECG strip. */
:root {
  /* 明场 brightfield, H&E: eosin takes to what is soft, hematoxylin to what is dense */
  --field: #f2f2f7;
  --ink: #17122e;
  --ink-2: rgba(23, 18, 46, .74);
  --ink-3: rgba(23, 18, 46, .52);
  --rule: rgba(23, 18, 46, .17);
  --eosin: #cf2264;
  --hema: #4338a0;
  --hema-deep: #221a5c;
  --sclera-0: #fffdfd;
  --sclera-1: #ebc3d3;
  --void: #110c25;
  --glint: #ffffff;
  --vignette: rgba(52, 42, 110, .17);
  --grain-o: .55;
  --glow: 0;
  --stamp-blend: multiply;
  --voice-w: 400;
  --mode: "明场 H&E";
  --display: "Bodoni Moda", "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
  --voice: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --mono: "DM Mono", "SFMono-Regular", Menlo, Consolas, "Noto Serif SC", "Songti SC", monospace;
}
/* 荧光 fluorescence: the same specimen with the lights off */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --field: #05060d; --ink: #e8edf8; --ink-2: rgba(232, 237, 248, .74); --ink-3: rgba(232, 237, 248, .5);
    --rule: rgba(232, 237, 248, .17); --eosin: #ff4d97; --hema: #5d6dff; --hema-deep: #1b1f70;
    --sclera-0: #cdd5ee; --sclera-1: #14163a; --void: #020207; --glint: #ffffff;
    --vignette: rgba(0, 0, 0, .66); --grain-o: .6; --glow: 1; --stamp-blend: screen; --voice-w: 300; --mode: "荧光 DAPI";
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --field: #05060d; --ink: #e8edf8; --ink-2: rgba(232, 237, 248, .74); --ink-3: rgba(232, 237, 248, .5);
  --rule: rgba(232, 237, 248, .17); --eosin: #ff4d97; --hema: #5d6dff; --hema-deep: #1b1f70;
  --sclera-0: #cdd5ee; --sclera-1: #14163a; --void: #020207; --glint: #ffffff;
  --vignette: rgba(0, 0, 0, .66); --grain-o: .6; --glow: 1; --stamp-blend: screen; --voice-w: 300; --mode: "荧光 DAPI";
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; overflow: hidden; }
body {
  height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--field); color: var(--ink);
  font-family: var(--mono); font-weight: 300; -webkit-font-smoothing: antialiased;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.plate {
  position: relative; height: 100%; box-sizing: border-box; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
@media (hover: hover) and (pointer: fine) { #stage { cursor: none; } }

.vignette, .grain { position: fixed; pointer-events: none; z-index: 1; transition: opacity 1.2s ease; }
.vignette { inset: 0; background: radial-gradient(ellipse 78% 72% at 50% 47%, transparent 52%, var(--vignette) 100%); }
.grain { inset: -160px; background-size: 128px 128px; opacity: var(--grain-o); animation: grain .7s steps(1) infinite; }
@keyframes grain {
  0% { transform: translate(0, 0); } 20% { transform: translate(-37px, 51px); } 40% { transform: translate(64px, -23px); }
  60% { transform: translate(-81px, -70px); } 80% { transform: translate(29px, 88px); }
}
.plate.cured .grain { opacity: 0; }
.plate.cured .vignette { opacity: .25; }

/* the rubber stamp that ends a case file */
.stamp {
  position: absolute; z-index: 2; left: 50%; top: 50%; translate: -50% -50%; rotate: -8deg; scale: 1.7; opacity: 0;
  display: grid; justify-items: center; gap: .12em; padding: .2em .42em .22em .74em;
  border: .07em solid var(--eosin); outline: .024em solid var(--eosin); outline-offset: .07em;
  color: var(--eosin); font-family: var(--voice); font-weight: 600; font-size: 48px; line-height: 1.1; letter-spacing: .32em;
  white-space: nowrap; pointer-events: none; mix-blend-mode: var(--stamp-blend);
  -webkit-mask-size: 160px 160px; mask-size: 160px 160px;
}
.stamp small { font-family: var(--mono); font-weight: 400; font-size: .2em; letter-spacing: .3em; margin-right: -.3em; }
.stamp.on { opacity: .88; scale: 1; transition: scale .13s cubic-bezier(.2, 1.5, .4, 1), opacity .07s linear; }
.stamp.run { opacity: 0; translate: -50% calc(-50% + 12px); filter: blur(1.5px); transition: opacity 2.8s ease-in, translate 2.8s ease-in, filter 2.8s ease-in; }

/* instrument captions */
.hud {
  position: relative; z-index: 3; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  pointer-events: none; font-size: 10.5px; line-height: 1.62; letter-spacing: .08em; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.hud button { pointer-events: auto; }
button:focus-visible { outline: 1px solid var(--eosin); outline-offset: 2px; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px 24px; align-items: start; }
.cap { margin: 0; display: grid; gap: 1px; min-width: 0; }
.cap > div { display: flex; gap: 1.1em; min-width: 0; }
.cap dt { color: var(--ink-3); white-space: nowrap; }
.cap dd { margin: 0; color: var(--ink); white-space: nowrap; }
.case dt { min-width: 12em; }
.scope { justify-self: end; }
.scope > div { justify-content: flex-end; }
.scope dd { min-width: 4.4em; text-align: right; }
.en { letter-spacing: .15em; }
.formula { font-family: var(--display); font-size: 1.34em; letter-spacing: .1em; line-height: 1; }
.formula sup { font-style: italic; font-size: .7em; letter-spacing: 0; }
.mode::before { content: var(--mode); }

.course { justify-self: center; display: grid; gap: 3px; justify-items: center; text-align: center; }
.course ol { list-style: none; margin: 0; padding: 0; display: flex; border-top: 1px solid var(--rule); }
.course li { position: relative; }
.course li::before { content: ""; position: absolute; left: 50%; top: -1px; width: 1px; height: 5px; background: var(--ink-3); }
.course button {
  font-family: var(--display); font-size: 15px; line-height: 1; letter-spacing: .06em; color: var(--ink-3);
  background: none; border: 0; padding: 12px 0 5px; width: 3.1em; cursor: pointer;
}
.course button:hover { color: var(--ink); }
.course li.past button { color: var(--ink-2); }
.course li.now button { color: var(--eosin); }
.course li.now::before { width: 2px; height: 9px; margin-left: -1px; background: var(--eosin); }
.course p { margin: 0; color: var(--ink); }

.bottom { display: grid; gap: 10px; }
.voice {
  margin: 0 auto; max-width: 32em; min-height: 3.5em; display: flex; align-items: flex-end; justify-content: center;
  text-align: center; text-wrap: balance; font-family: var(--voice); font-weight: var(--voice-w);
  font-size: clamp(16px, 11px + 1.05vw, 25px); line-height: 1.75; letter-spacing: .14em; color: var(--ink);
}
.voice span::after {
  content: ""; display: inline-block; width: 1px; height: 1.05em; margin-left: .2em; vertical-align: -.16em;
  background: var(--eosin); opacity: 0;
}
.voice.typing span::after { opacity: 1; }
.tools { display: flex; align-items: flex-end; gap: 18px; min-height: 30px; }
.log { flex: 1; min-width: 0; list-style: none; margin: 0; padding: 0; font-size: 10px; color: var(--ink-3); }
.log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log li:last-child { color: var(--ink-2); }
.scale { margin-left: auto; display: grid; justify-items: end; gap: 3px; white-space: nowrap; }
.scale i { display: block; height: 2px; width: 80px; background: var(--ink); }
.btns { display: flex; gap: 6px; }
.btns button {
  font: inherit; letter-spacing: .14em; color: var(--ink-2); background: none; border: 1px solid var(--rule);
  border-radius: 0; padding: .62em 1em; cursor: pointer; white-space: nowrap;
}
.btns button:hover { color: var(--ink); border-color: var(--ink-3); }
.btns button[aria-pressed="true"] { color: var(--eosin); border-color: var(--eosin); }
.ecg {
  height: 46px; display: flex; justify-content: space-between; align-items: flex-start;
  border-top: 1px solid var(--rule); padding-top: 3px; font-size: 9px; color: var(--ink-3);
}

@media (max-width: 900px) { .log { visibility: hidden; } }
@media (max-width: 720px) {
  .hud { font-size: 10px; letter-spacing: .05em; }
  .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px; }
  .course { grid-column: 1 / -1; grid-row: 2; }
  .en { display: none; }
  .case dt { min-width: 4.6em; }
  .cap > div { gap: .8em; }
  .ecg { height: 40px; }
  .log { display: none; }
}
@media (max-height: 520px) {
  .voice { min-height: 2em; }
  .ecg { height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  .grain { animation: none; }
  .stamp.on { transition: none; }
}
</style>

<main class="plate" id="plate" lang="zh-CN">
  <h1 class="sr">LO-O-OVE</h1>
  <canvas id="stage" role="img" aria-label="LO-O-OVE 这个词的显微图像。每个 O 都是一只注视着您的眼睛，连字符是缝线；O 会不断分裂。"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" id="grain" aria-hidden="true"></div>
  <div class="stamp" id="stamp" aria-hidden="true">痊愈<small>CURED · 准予出院</small></div>

  <div class="hud" id="hud">
    <header class="top" id="hud-top">
      <dl class="cap case">
        <div><dt>病例 <span class="en">CASE</span></dt><dd id="c-case">0214 · 初诊</dd></div>
        <div><dt>标本 <span class="en">SPECIMEN</span></dt><dd><span class="formula">LO<sup>n</sup>VE</span>，n = <span id="c-n">003</span></dd></div>
        <div><dt>观察对象 <span class="en">SUBJECT</span></dt><dd>您</dd></div>
      </dl>
      <nav class="course" aria-label="病程">
        <ol id="course">
          <li><button type="button" data-stage="I" aria-label="第一期 潜伏期">I</button></li>
          <li><button type="button" data-stage="II" aria-label="第二期 前驱期">II</button></li>
          <li><button type="button" data-stage="III" aria-label="第三期 发作期">III</button></li>
          <li><button type="button" data-stage="IV" aria-label="第四期 慢性期">IV</button></li>
          <li><button type="button" data-stage="V" aria-label="第五期 终末期">V</button></li>
          <li><button type="button" data-stage="VI" aria-label="第六期 复发">VI</button></li>
        </ol>
        <p id="c-stage">潜伏期 <span class="en">INCUBATION</span></p>
      </nav>
      <dl class="cap scope">
        <div><dt class="mode"></dt><dd id="c-mag">×40</dd></div>
        <div><dt>心率 <span class="en">HR</span></dt><dd id="c-hr">---</dd></div>
        <div><dt>固定 <span class="en">FIXATION</span></dt><dd id="c-fix">00:00</dd></div>
        <div><dt>断线 <span class="en">TORN</span></dt><dd id="c-torn">00</dd></div>
      </dl>
    </header>
    <div></div>
    <footer class="bottom" id="hud-bottom">
      <p class="voice" id="voice" aria-hidden="true"><span></span></p>
      <p class="sr" id="voice-sr" aria-live="polite"></p>
      <div class="tools">
        <ol class="log" id="log" aria-hidden="true"></ol>
        <div class="scale" aria-hidden="true"><i id="scale-bar"></i><span id="scale-txt">5 µm</span></div>
        <div class="btns">
          <button type="button" id="b-sound" aria-pressed="false">声音 关</button>
          <button type="button" id="b-pause" aria-pressed="false">暂停</button>
        </div>
      </div>
      <div class="ecg" id="ecg" aria-hidden="true"><span>II</span><span>25 mm/s</span></div>
    </footer>
  </div>
</main>

<script>
/*
 * LO-O-OVE ── 病程记录
 *
 * 病例 0214。主诉：有一个词，说不完。
 * 每卡住一次，多出一个 O；每个 O 睁开，成为一只眼睛。
 * 连字符是缝线。心电图按这个词的口吃在跳：L · O-O-O · V · E。
 * 把词完整说出口即可痊愈；痊愈后无应答。患者因此拒绝痊愈。
 *
 * 读代码的人：您好。下面没有什么可藏的。除了那个词。
 */
(() => {
  'use strict';

  /* ───────── helpers ───────── */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const $ = (id) => document.getElementById(id);
  const pad = (n, w) => String(Math.max(0, Math.round(n))).padStart(w, '0');
  const clock = (s) => pad(Math.floor(s / 60), 2) + ':' + pad(Math.floor(s % 60), 2);
  const gauss = (x, m, s) => Math.exp(-((x - m) * (x - m)) / (2 * s * s));
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const CN = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  const cn = (n) => (n <= 10 ? CN[n] : n < 20 ? '十' + CN[n - 10] : String(n));
  function spanText(sec) {
    sec = Math.max(1, Math.round(sec));
    if (sec < 60) return ` ${sec} 秒`;
    if (sec < 3600) return ` ${Math.floor(sec / 60)} 分 ${sec % 60} 秒`;
    if (sec < 172800) return ` ${Math.floor(sec / 3600)} 小时 ${Math.floor((sec % 3600) / 60)} 分`;
    return ` ${Math.floor(sec / 86400)} 天`;
  }

  /* switches that only mean something when this is opened as a local file */
  const Q = new URLSearchParams(location.search);
  const DEV = { warp: Math.max(1, +Q.get('warp') || 1), stage: Q.get('stage'), theme: Q.get('theme') };
  if (DEV.theme === 'dark' || DEV.theme === 'light') document.documentElement.dataset.theme = DEV.theme;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 我记得您来过几次。记不住的时候，就当作第一次。 */
  const memory = { visits: 1, gap: 0 };
  try {
    const m = JSON.parse(localStorage.getItem('lo-o-ove') || 'null');
    if (m && m.visits > 0) { memory.visits = (m.visits | 0) + 1; memory.gap = (Date.now() - (m.last || Date.now())) / 1000; }
    localStorage.setItem('lo-o-ove', JSON.stringify({ visits: memory.visits, last: Date.now() }));
  } catch (e) { /* 没关系 */ }

  /* ───────── palette: read from the CSS tokens, so the canvas follows the theme ───────── */
  const C = {};
  const hexRgb = (h) => {
    h = h.replace('#', '');
    if (h.length === 3) h = h.replace(/./g, '$&$&');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const mix = (a, b, t) => [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t));
  function readPalette() {
    const cs = getComputedStyle(document.documentElement);
    const get = (k) => cs.getPropertyValue(k).trim();
    const map = { field: '--field', ink: '--ink', eosin: '--eosin', hema: '--hema', hemaDeep: '--hema-deep',
      sclera0: '--sclera-0', sclera1: '--sclera-1', void: '--void', glint: '--glint' };
    for (const key in map) { C[key] = get(map[key]) || '#888888'; C[key + 'Rgb'] = hexRgb(C[key]); }
    C.glow = get('--glow') === '1';
  }

  /* ───────── DOM + world ───────── */
  const plate = $('plate'), cv = $('stage'), ctx = cv.getContext('2d', { alpha: false });
  const stainCv = mk(2, 2), sctx = stainCv.getContext('2d');
  const stampEl = $('stamp');
  let W = 800, H = 600, DPR = 1;
  const stageRect = { x: 0, y: 0, w: 100, h: 100 }, ecgRect = { x: 0, y: 0, w: 0, h: 0 };

  const sim = { t: 0, acc: 0, last: 0, ff: false, paused: false };
  const state = {
    stage: 'I', stageT0: 0, cycle: 1, curing: false, cured: false, sterile: false, collapsing: false,
    dilate: 0.4, rest: 1.3, threadsMax: 0, tighten: false, trail: false, torn: 0, watch: 0,
  };
  const layout = { cap: 100, ceil: Infinity, titleCap: 100, block: { x: 0, y: 0, w: 0, h: 0 } };
  const growth = { on: false, gain: 1, acc: 0, full: false, min: 42, max: 160 };
  const ptr = { x: 0, y: 0, px: 0, py: 0, has: false, inside: false, type: 'mouse', lastMove: -99, exitT: -99 };
  const look = { x: 0, y: 0, front: 0, force: 0, real: false, idleSaid: false, grace: 0 };
  const heart = { on: false, flat: false, bpm: 54, bpmT: 54, next: 0, beats: [], runs: [], rate: 0, lastBeat: -99 };
  const ecg = { buf: new Float32Array(0), head: 0, speed: 105, total: 0 };
  const stain = { fade: 0, ink: -999 };
  let seq = [];
  const threads = [], drips = [];
  let threadTimer = 0;

  /* ───────── letterforms: a didone built by hand, cap height = 1, y down ───────── */
  const ADV = { L: 0.70, O: 1.08, H: 0.46, V: 0.92, E: 0.70 };
  const MIDX = { L: 0.31, O: 0.54, H: 0.23, V: 0.45, E: 0.31 };
  const TRACK = 0.075, LEAD = 1.2, STEM = 0.17;
  const O = { cx: 0.54, cy: 0.5, RX: 0.5, RY: 0.515, a: 0.33, b: 0.475, ri: 0.21, mx: 0.17, my: 0.235 };
  const TITLE = ['L', 'O', 'H', 'O', 'H', 'O', 'V', 'E'];
  const hair = (s) => Math.max(0.026, 1.1 / s);

  function drawL(t) {
    ctx.beginPath(); ctx.rect(0.09, 0, STEM, 1); ctx.rect(0, 0, 0.35, t); ctx.rect(0, 1 - t, 0.62, t); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0.62, 1); ctx.lineTo(0.42, 1); ctx.lineTo(0.42, 1 - t);
    ctx.quadraticCurveTo(0.59, 0.96, 0.606, 0.69); ctx.lineTo(0.62, 0.69); ctx.closePath(); ctx.fill();
  }
  function drawE(t) {
    ctx.beginPath(); ctx.rect(0.09, 0, STEM, 1); ctx.rect(0, 0, 0.60, t); ctx.rect(0, 1 - t, 0.62, t);
    ctx.rect(0.09 + STEM, 0.5 - t / 2, 0.2, t); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0.60, 0); ctx.lineTo(0.60, 0.29); ctx.lineTo(0.586, 0.29);
    ctx.quadraticCurveTo(0.57, 0.04, 0.41, t); ctx.lineTo(0.41, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0.62, 1); ctx.lineTo(0.42, 1); ctx.lineTo(0.42, 1 - t);
    ctx.quadraticCurveTo(0.59, 0.96, 0.606, 0.69); ctx.lineTo(0.62, 0.69); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0.462, 0.365); ctx.lineTo(0.476, 0.365); ctx.lineTo(0.476, 0.635); ctx.lineTo(0.462, 0.635);
    ctx.quadraticCurveTo(0.455, 0.52, 0.39, 0.5 + t / 2); ctx.lineTo(0.39, 0.5 - t / 2);
    ctx.quadraticCurveTo(0.455, 0.48, 0.462, 0.365); ctx.closePath(); ctx.fill();
  }
  function drawV(t) {
    ctx.beginPath(); ctx.rect(0, 0, 0.36, t); ctx.rect(0.69, 0, 0.21, t); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0.08, 0); ctx.lineTo(0.28, 0); ctx.lineTo(0.5397, 0.7214); ctx.lineTo(0.785, 0);
    ctx.lineTo(0.82, 0); ctx.lineTo(0.48, 1); ctx.lineTo(0.44, 1); ctx.closePath(); ctx.fill();
  }
  function ring() {
    ctx.beginPath(); ctx.ellipse(O.cx, O.cy, O.RX, O.RY, 0, 0, TAU);
    ctx.moveTo(O.cx + O.a, O.cy); ctx.ellipse(O.cx, O.cy, O.a, O.b, 0, 0, TAU); ctx.fill('evenodd');
  }
  const LETTER = { L: drawL, V: drawV, E: drawE };

  function glyph(type) {

  /* ───────── one step of the simulation ───────── */

  /* ───────── drawing ───────── */
  function place(g, ox = 0, oy = 0) {
