name: Build Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for this build
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # speech engine + voice model downloaded by the build (checksum-pinned in app/build.gradle.kts)
      - uses: actions/cache@v4
        with:
          path: android/.cache
          key: tts-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      # Release APKs carry the private Clau娘 key (see android/signing/sign-release.sh). The key is stored
      # encrypted in the repo; the CLAU_SIGNING_KEY repository secret unlocks it.
      - name: Sign with the Clau娘 key
        env:
          SIGNING_KEY: ${{ secrets.CLAU_SIGNING_KEY }}
          IN_VARIABLES: ${{ vars.CLAU_SIGNING_KEY != '' }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || inputs.release == true }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            if [ "$IN_VARIABLES" = "true" ]; then
              msg="CLAU_SIGNING_KEY was added under Variables. Move it to the Secrets tab (Repository secrets) of Settings > Secrets and variables > Actions."
            else
              msg="Repository secret CLAU_SIGNING_KEY is missing (Settings > Secrets and variables > Actions > Secrets tab > New repository secret)."
            fi
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::warning::$msg This test build keeps the old signing key."
            exit 0
          fi
          signing/sign-release.sh app/build/outputs/apk/release/app-release.apk

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ClauNiang-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClauNiang-${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: android/dist/*.apk
          if-no-files-found: error

      # Publish a GitHub Release (direct APK download on a phone) only when asked: the pushed commit
      # message contains [release], a v* tag is pushed, or the workflow is run by hand with "release"
      # ticked (Actions > Build Android APK > Run workflow). The action creates the tag itself.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Clau娘 ${{ steps.ver.outputs.version }}
          make_latest: true
          # what changed (also shown in the app's update reminder); edit before each [release]
          body_path: android/release-notes.md
          files: android/dist/*.apk
