name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # speech engine + voice model downloaded by the build (checksum-pinned in app/build.gradle.kts)
      - uses: actions/cache@v4
        with:
          path: android/.cache
          key: tts-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Test and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ClauNiang-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClauNiang-${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: android/dist/*.apk
          if-no-files-found: error

      # Publish a GitHub Release (direct APK download on a phone) only when asked: the pushed commit
      # message contains [release], or a v* tag is pushed. The action creates the tag itself.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Clau娘 ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            在手机上点下面的 APK 下载安装（需要允许安装未知来源应用）。
            首次打开点“请她出来”，并允许“显示在其他应用上层”。
            新版本可以直接覆盖安装，不需要先卸载。

            提交：${{ github.event.head_commit.message }}
          files: android/dist/*.apk
